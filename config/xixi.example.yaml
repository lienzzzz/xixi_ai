# 西西第一版配置（对应《方案》第 42 节）。
# 复制为 config/xixi.yaml 后按需修改；config/xixi.yaml 不进入版本库。
#
# 存储位置不在这个文件里（V0.3 P0-B）：所有 household 入口（终端对话 / 试用页 / 现场测试控制台 /
# 感知入库）默认连同一个 canonical store：
#   XIXI_DATA_DIR 未设 → data/xixi/xixi.sqlite
#   XIXI_DATA_DIR=/some/abs/path （或相对当前目录的路径）→ 那一个库
# 单个入口仍可用自己的开关隔离（XIXI_CHAT_DATA_DIR / XIXI_WEB_DATA_DIR / XIXI_VOICE_DATA_DIR、
# 控制台的 --data-dir、voice-turn 的 --isolated-store）；测试与评测用临时目录。
xixi:
  identity:
    name: 西西
    language: zh-CN
    timezone: Asia/Shanghai
    # 家里常说的地点，可省略；省略时天气工具会先问用户是哪里。
    place: 成都

  models:
    llm:
      provider: mimo
      model: mimo-v2.6-flash
      thinking_realtime: false
    asr:
      provider: mimo
      model: mimo-v2.5-asr
    tts:
      provider: mimo
      model: mimo-v2.5-tts

  personality:
    base:
      proactivity: 0.85
      # 出厂默认取「话痨」档：只有 talkativeness ≥ 0.65 与 verbosity ≥ 0.66 才落进
      # packages/conversation/src/prompt.ts 的**顶档**区间（分别给出「可以自然地多聊一点…」与
      # 「可以多说一点（3~5 句）…」两条指令）。往回调这两个数，等于把出厂默认降档。
      talkativeness: 0.75
      verbosity: 0.70
      curiosity: 0.40
      warmth: 0.80
      humor: 0.30
      playfulness: 0.20
      formality: 0.15
      emotional_expressiveness: 0.45

  proactive:
    # 主动行为（方案 §15、ADR-0009 → P5/ADR-0011）。分两层：
    # ① 硬底线由程序判定、模型不能绕过：静默时段（quiet_hours）、6 小时与当日开口额度、当日问询额度、
    #    新会话速率下限（new_session_min_gap_min）、DND、隐私与同意；② 底线之上「要不要说」由模型读空气决定，
    #    下面的分数只提供候选与依据。
    # P5 之前这里是「单一冷却 + 单一阈值一票否决」，实测像定时播报；现在冷却/话题重复/未回应都只是
    # **扣分信号**（见 base_cooldown_min / same_topic_penalty / unanswered_penalty），不再单独拦人。
    # 安全底线不动：quiet_hours 仍是硬门禁，人格与模型都不能放宽它。
    # 本段**已被代码读取**：`ProactiveEngine` 的默认构造路径会走
    # `parseProactiveSettings(config.proactive)`（packages/conversation/src/proactive.ts），
    # 现场测试控制台也用它来显示与改写门禁参数（scripts/field-test.ts）。
    # 也就是说改这里的数字会真的改变判定——不要只改代码里的常量。
    enabled: true
    base_cooldown_min: 18          # 「刚开口过」的打扰代价衰减窗口（P5 起不再是禁止窗口；pack v02 的 new_session.cooldown_min）
    continuation_cooldown_min: 0   # 热聊中接话不付打扰代价（pack §14.3：conversation continuation cooldown = 0）
    max_per_6h: 15                 # 6 小时滑动窗口上限
    max_per_day: 40                # 本地自然日开口上限（只算真正说出口的次数）
    max_consults_per_day: 120      # 「问模型说还是不说」的当日次数上限（与开口额度分开计——t9 F4：问询不吃开口额度；仍是费用代理，本项目没有金额级费用上限）
    new_session_min_gap_min: 2     # 新会话速率下限：非「热聊接话」的主动与上一条开口至少隔这么久（t9 F6；热聊接话不受限，pack §14.3）
    hot_chat_min_turns: 2          # 「正在热聊」的判定：对话还开着，且下面这个窗口里有这么多次用户轮次才算热聊（t9 F5；0/1 = 只要对话开着就算）
    hot_chat_window_min: 15        # 上面那次数的统计窗口（分钟）——一句孤零零的搭话不算热聊，所以被忽视的一天仍会显著降频
    topic_repeat_window_h: 12      # 同主题重复惩罚的窗口（pack v02：same_topic_cooldown_hours 12）
    generic_topic_cooldown_h: 24   # 没带具体话题的泛泛开口，用更长的窗口扣分（pack v02：generic 24）
    # 未回应惩罚（ADR-0011 §决定 2 的补充，2026-10-01 定口径）：它只是**扣分信号**，不是禁止——
    # 连续两次没人回应之后取「**显著降频**」，不取 pack 测试文档那句更严的「继续主动 = 0」。
    # 判据是一个幅度：同一条多日脚本在惩罚开/关下的开口数之差，命令
    # `node scripts/eval-proactive-timeline.ts` 的 M1–M6 判定表（多日部分）。
    unanswered_penalty: 0.45       # 最近几条主动没人回应时的扣分（pack v02：unanswered 0.45）
    explicit_reject_penalty: 0.80  # 「别说了 / 今天不想聊」时的扣分（pack v02：explicit_reject 0.80）
    same_topic_penalty: 0.55       # 同一话题重复的扣分（pack v02：same_topic 0.55）
    unanswered_window_min: 10      # 一条主动发出后等多久没人回答就算「未回应」
    negative_feedback_cooldown_multiplier: 2.0   # 最近一次主动被负面反馈后，上述扣分与额度一起收紧
    quiet_hours:
      start: "23:30"
      end: "07:30"
    triggers:                      # 触发源开关（ADR-0009 第 2 条，按 §16 优先级）
      future_hook_due: true
      presence_arrived: true
      conversation_dangling: true
      routine_expected: true
      topic_pool: true
      random_smalltalk: false      # §16：没有合适的话题就不要为了主动而主动

  # 未完话题（pack Phase 3，《方案》§9 §10）。「惦记着没办完的事」是主动开口里优先级最高的来源
  # （pack §9 的 OpenThread = 1.00）：父亲自己说过「明天下午我要去镇上办证」，第二天到点后就该问一句。
  # 本段**已被代码读取**：`packages/conversation/src/topic-engine.ts` 的 `parseTopicEngineSettings`
  # 读它，现场测试控制台按它装配 `TopicEngine`（scripts/field-test.ts）。提取与收口全靠规则，
  # 不经过模型（铁律 1）：只有「时间词 + 意愿 + 动作」三者齐备才记一件事。
  open_threads:
    enabled: true               # 关掉后不再提取、也不再出追问候选（库里已有的话题保持原样）
    reoffer_after_min: 180      # 问过一次没人回答，隔这么久才允许再问一次（默认最多问 2 次）
    max_attempts: 2             # 同一件事最多主动问几次；超过就作废，不再打扰
    followup_window_h: 48       # 追问窗口：到点之后这么久还没收口就作废（exhausted）
    topic_dedupe_h: 12          # 同一话题在候选里的抑制窗口（与 proactive.topic_repeat_window_h 同口径）

  # 多段回复（ADR-0010）。一轮最多 8 段；这里只能在上限内收紧，不能突破。
  # 本段**已被代码读取**：`ConversationEngine` 构造时 `resolveReplyLimits(config.reply)` 会把它们夹进
  # ADR-0010 的硬上限（packages/conversation/src/segments.ts），试用页与现场测试控制台也用它算分段展示。
  # P1（2026-10-01）：`segment_max_chars` 是每段的块长（一次播报的粒度），`max_segments` 才是「一轮能说多长」
  # 的容量。V0.1 的 3 × 60 = 180 字把回复长度锁死在 180 字（基线 §2.5 实测 9/19 轮贴着上限），
  # 现在容量是 8 × 60 = 480 字：长解释不必被截，也不再逼着每轮都说满。
  reply:
    max_segments: 8                # 硬上限 8（P1 由 3 提高）
    segment_max_chars: 60          # 每段块长（汉字），硬上限 60
    gap_ms: 450                    # 段间停顿，允许范围 [250, 1200]

  memory:
    raw_transcript_retention_days: 30
    raw_audio_retention_days: 0
    event_log_retention_days: 90
    semantic_memory: true
    future_hooks: true
    # pack Phase 4 新增的两种记忆（表在迁移 004；这段是**声明**，读取方是 domain 的 MemoryStore 调用方）：
    episodic_memory: true    # 发生过的事（将来的计划、一次明确纠正）
    relationship_notes: true # 「我们怎么相处」的笔记（由明确反馈写下来）
    async_extraction: true   # 提取在回复之后异步做（《方案》§11.1：不阻塞语音）

  # 上下文装配（V0.3 P1 / pack `docs/02_MEMORY_CONTEXT.md` §1–§3）。
  # 本段**已被代码读取**：`ConversationEngine` 构造时用 `parseContextMemorySettings(context.memory, memory)`
  # 建 `@xixi/context` 的 `ContextBuilder`——记忆/关系/未完话题/世界状态/有效自我画像的装配都在它那里，
  # 引擎不再自己决定上下文来源（FSM、事件与回复安全仍在引擎）。
  # 记忆检索是**确定性混合排序**（词面相关 + 近因 + 重要度 + 置信 + 主语匹配 + 与未完话题的关系
  # − 陈旧 − 已提及惩罚），第一版没有向量库。每个旋钮的含义：
  #   enabled              false 时这一层完全不检索（提示词与 P0 逐字相同；对照实验用）
  #   max_items            一轮最多注入几条，硬边界 [3, 8]（pack §2：不要每轮 dump 全部记忆）
  #   min_confidence       低于它的候选不进提示词（0.55 = 模型推断 0.4 进不来、程序提炼 0.8 进得来）
  #   include_relationship 关系摘要那一段（不关也不会把全统计给模型：只给几句中文）
  #   include_open_threads 未完话题那一段（它是「将来还要接的话」，不是记忆）
  # 老段的同名键（max_items 等）仍然生效，但**本段优先**；越界的值会报错而不是被静默忽略。
  context:
    memory:
      enabled: true
      max_items: 6
      min_confidence: 0.55
      include_relationship: true
      include_open_threads: true

  # 三层自我画像与反馈学习（pack Phase 4 / 《方案》§7.4 §13）。
  # BaseProfile（personality.base）+ LearnedProfile + SessionOverride = 有效人格。
  # 本段**已被代码读取**：`packages/domain/src/self-model.ts` 的 `parseSelfModelSettings` 读它，
  # 现场测试控制台与试用页用它构造 `SelfModel`（scripts/field-test.ts、scripts/serve-chat.ts）。
  # 上限按《方案》§7.4：明确长期指令一次最大 ±0.15；隐式/推断反馈单次最多 ±0.03；
  # 学习层累计漂移 ±0.30（不允许单次抱怨把属性拉到极端）；会话覆盖只对当天有效，次日自动恢复。
  self_model:
    learning_enabled: true        # 关掉后不再学习（已有偏移保持原样，可 rollback）
    daily_limit_explicit: 0.15    # 明确长期指令的单日累计上限
    daily_limit_inferred: 0.03    # 模型推断（读空气白名单码）的单日累计上限——权重只有显式的 0.4
    drift_limit: 0.30             # 学习层累计偏移上限
    session_override_limit: 0.35  # 「今天想安静点」这类当天覆盖的单次上限

  # 有界的心情（第五轮 t4）：短期情绪状态，由事件演化（被夸 / 被嫌 / 被明确叫停、主动没人应 /
  # 有人接、有人到家、深夜与清晨），按时间向中性回落，两个维度都在 [0,1] 内**可证明**不越界。
  # 本段**已被代码读取**：`packages/domain/src/mood.ts` 的 `parseMoodSettings` 读它，
  # `packages/conversation/src/mood-engine.ts` 用它演化（默认每个 live 入口都开）。
  # 它只影响**语气**与对话窗口（各最多 ±6%，权重远小于上面的人格层），**不参与任何硬底线**：
  # 静默时段 / 额度 / 隐私都在 `proactive.ts` 的硬门禁里判定，那条路径拿不到心情。
  # 查看与复位走领域接口（`XixiStore.mood` / `moodHistory` / `resetMood`）；控制台面板属于下一轮。
  mood:
    enabled: true                 # 关掉后不再演化（已有状态保持原样，仍可查看与复位）
    decay_per_hour: 0.075         # 每小时把「距中性多远」抹掉约 7.5%（半衰期约 9 小时）
    decay_cap: 0.6                # 两次评估之间最多抹掉 60% 的偏离（断电再开机不会心情被清空）
    max_signals_per_beat: 8       # 一次评估最多吸收多少条信号（多出来的留给下一拍）

  privacy:
    continuous_audio_cloud_upload: false
    continuous_video_cloud_upload: false
    store_raw_audio: false

  features:
    wake_word: false        # M1 先用按钮，M2 再启用
    speaker_verification: false
    camera_presence: false  # M6
    home_assistant: false
    frigate: false

  # 「看一眼」（t88）：按需把**一张缩略静帧**发给模型，让西西能说出画面里的内容。
  # 本段已被代码读取：现场测试控制台读 max_width_px（尺寸上限）与 auto_look（自主看的出厂默认值）；
  # 页面上的开关一旦动过，就以库里的选择为准（system.health / service=vision-settings）。
  vision:
    look_once: true          # 手动按钮「看一眼」：按下才发，默认只允许这种触发
    auto_look: false         # 自主看：默认关。打开后主动开口才可能附一张帧（仍要过全部硬门禁）
    max_width_px: 480        # 超过这个宽度的帧会被拒绝，而不是放大/缩小再发（仓库里没有图像库）
    jpeg_quality: 60         # 由感知边编码（perception_edge.run --jpeg-quality，默认 60）
    # 铁律 6：连续音视频不上云。只有这里允许的、被程序显式选中的单帧才会发给模型；
    # 每次上传都写一条 system.health（service=vision-look-once）记录：时间/大小/触发源/结果，
    # **记录里没有图像**，图像也不落盘（帧只在内存与 localhost 之间）。
